# 번들 ID. 2026-09-07에 com.supaicy.haru → com.begreen.greenday 로 바꿨다(사용자 결정).
# 실제로 배포된 v1.4.1은 com.haru.app 이었고 com.supaicy.haru 는 한 번도 나간 적이 없다
# (docs/reports/2026-09-07-v1.4.1-shipped-build.md). 그래서 어느 ID로 가든 옛 사용자와의
# 자동 업데이트 연속성은 끊기며, 이왕이면 제대로 된 이름으로 간다.
#
# **package.json 의 name/productName 은 같이 바꾸지 않는다.** Electron 내부 앱 이름
# (`ticktick`)이 Keychain 항목 `ticktick Safe Storage` 와 userData 경로를 정하므로,
# 그것까지 바꾸면 기존 암호문을 프롬프트도 없이 조용히 못 읽게 된다.
appId: com.begreen.greenday
productName: Greenday
directories:
  buildResources: resources
  output: dist
# 허용 목록 방식. 이전에는 제외 패턴만 나열해서, 나중에 생긴 디렉터리는 전부
# 앱 안으로 딸려 들어갔다. 실제로 docs/(설계·배포 문서), .gstack/(QA 리포트 +
# 실제 할 일이 보이는 스크린샷 67장), .superpowers/, CLAUDE.md, TODOS.md가
# 배포본에 포함돼 app.asar이 59.6MB였다.
# 런타임에 필요한 건 out/(main·preload·renderer 번들)과 package.json뿐이고,
# 프로덕션 node_modules는 electron-builder가 알아서 넣는다.
files:
  # `out/main|preload|renderer`만 — `out/**/*`로 두면 `tsc --build`가 같은 곳에
  # 뱉는 `out/src/**`가 통째로 asar에 들어간다. 거기엔 모든 `*.test.js`와
  # 테스트 전용 헬퍼가 있다. CI는 클린 체크아웃이라 안 걸리고, 로컬에서
  # typecheck 뒤 package를 돌릴 때만 조용히 실린다.
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - package.json
mac:
  target:
    - dmg
    - zip
  # **버전을 이름에 넣지 않는다.** 넣으면 릴리스마다 파일명이 달라져
  # `/releases/latest/download/<이름>` 형태의 고정 주소를 만들 수 없다 —
  # 사이트가 릴리스 목록 페이지로 보낼 수밖에 없고, 사용자가 아홉 개 파일 중에
  # 고르게 된다. 이름을 고정하면 태그를 밀 때마다 같은 주소가 최신을 가리킨다.
  # 자동 업데이트는 latest-mac.yml이 실제 파일명을 들고 있어 영향받지 않는다.
  # begreen.dev 사이트(site/build.ts 의 greenday.assets)와 Homebrew cask
  # (.github/workflows/release.yml 의 bump-cask)가 이 이름을 그대로 쓴다.
  artifactName: ${productName}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  category: public.app-category.productivity
  darkModeSupport: true
  # Electron 40 바이너리 자체의 LSMinimumSystemVersion 이 12.0 이다
  # (node_modules/electron/dist/Electron.app/Contents/Info.plist). 명시하지 않아도
  # 같은 값이 들어가지만, README·사이트("macOS 12+")·cask(depends_on)가 한 값을
  # 보게 여기 적어 둔다. 11(Big Sur)로 낮춰 적어도 Electron 이 안 뜨므로 의미가 없다.
  minimumSystemVersion: '12.0'
  extendInfo:
    # 표준 TLS(HTTPS)와 OS Keychain 만 쓴다 — 자체 암호화 구현이 없어 수출 규제
    # 면제 대상이다. 이 키가 없으면 App Store Connect 가 빌드마다 수출 규정 설문을
    # 묻고, 답하기 전까지 TestFlight·심사 제출이 막힌다. 직접 배포 dmg 에는
    # 무해하다.
    ITSAppUsesNonExemptEncryption: false
  # 앱을 URL로 여는 커스텀 스킴(번들 ID와 같다). 구글 OAuth 콜백은 이제 루프백
  # (src/shared/app-id.ts)이라 이 스킴을 쓰지 않지만, index.ts 의 open-url ·
  # second-instance 배선이 여기에 기대므로 정의는 남긴다.
  protocols:
    - name: Greenday
      schemes:
        - com.begreen.greenday
mas:
  entitlements: resources/entitlements.mas.plist
  entitlementsInherit: resources/entitlements.mas.inherit.plist
  hardenedRuntime: false
  category: public.app-category.productivity
  extendInfo:
    ITSAppUsesNonExemptEncryption: false
  # developer.apple.com에서 'Mac App Store' 유형으로 발급받아 이 경로에 둔다.
  # 옛 App ID(com.supaicy.haru)용 파일은 치웠다(2026-10-06 현재 이 경로에 파일이 없다).
  # com.begreen.greenday 로 새로 발급해 넣어야 한다 — 그 전까지
  # scripts/mas-preflight.sh 의 프로파일 항목이 실패하는 것이 정상이다.
  # 다른 앱의 프로파일로도 빌드는 되고 업로드에서 거절되므로, preflight 가 미리 막는다.
  provisioningProfile: resources/embedded.provisionprofile
  # **MAS pkg 이름에만 버전을 넣는다.** 위 `mac.artifactName` 은 고정 다운로드 주소
  # 때문에 일부러 버전을 뺐는데, `mas:` 가 `artifactName` 을 적지 않으면 그 이름을
  # 그대로 물려받는다 — app-builder-lib 의 macPackager 가 MAS 옵션을
  # `deepAssign({}, mac, mas)` 로 만들기 때문이다. 그러면 산출물이
  # `dist/mas-universal/Greenday-universal.pkg` 가 되는데 `scripts/mas-upload.sh` 는
  # `<productName>-<version>*.pkg` 를 찾으므로, 빌드가 성공한 직후에도
  # "올릴 pkg가 없습니다. 먼저 빌드하세요: npm run mas:build" 로 끝났다 —
  # 빌드와 업로드가 서로를 가리켜 App Store 출시 경로가 통째로 막혔다.
  # App Store pkg 는 고정 주소로 내려받지 않으니 버전을 넣어도 잃을 것이 없고,
  # `mas:build` 가 dist/ 를 비우지 않으므로 **지난 릴리스 pkg 를 새 빌드로 착각해
  # 올리는 사고**까지 이름만으로 막힌다.
  # 이름을 만드는 쪽과 찾는 쪽이 어긋나는지는 src/shared/masArtifactName.test.ts 가 본다.
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  # 위 mac.artifactName 과 같은 이유로 버전을 넣지 않는다.
  artifactName: ${productName}-${arch}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: supaicy
  # 저장소는 2026-08에 haru → greenDay 로 개명됐다(gh api repos/supaicy/haru → full_name
  # supaicy/greenDay). 옛 이름은 GitHub 이 리디렉션해 주지만, 누군가 haru 라는 저장소를
  # 새로 만들면 그 순간 끊긴다. 정식 이름을 쓴다.
  repo: greenDay
  # **업데이트 feed 분리.** electron-updater(GitHub)는 저장소의 "Latest" 릴리스에서
  # `<channel>-mac.yml`을 읽는다. 옛 앱(v1.4.1·브리지 v1.5.0)은 채널이 없어 `latest-mac.yml`
  # 을 찾고, 새 앱은 `greenday-mac.yml`을 찾는다. 그래서 새 앱 릴리스가 Latest가 돼도
  # 옛 앱은 그 파일을 못 찾아 업데이트로 받지 않는다 — 다른 번들 ID의 앱이 옛 자리에
  # 앉는 일이 없다. 자세한 순서는 docs/2026-09-07-브리지-릴리스.md.
  channel: greenday
  # **updaterCacheDirName 을 여기 적지 말 것 — electron-builder 가 통째로 버린다.**
  # app-update.yml 을 쓰는 자리(app-builder-lib/out/publish/PublishManager.js 의
  # getAppUpdatePublishConfiguration)가 `{...publishConfigs[0], updaterCacheDirName:
  # appInfo.updaterCacheDirName}` 으로 **우리 값 뒤에** 자기 값을 덮어쓴다. 그 값은
  # package.json 의 `name` 에서 하드 유도된다(appInfo.js: `sanitizedName.toLowerCase()
  # + "-updater"`) — 즉 `ticktick` → `ticktick-updater`. 실측: 지난 빌드 산출물
  # dist/mac-arm64/haru.app/Contents/Resources/app-update.yml 이 이미
  # `updaterCacheDirName: ticktick-updater` 다.
  # 최상위 키로 빼는 것도 답이 아니다 — scheme.json 은 이 키를 publish 프로바이더
  # 옵션에만 두고 루트는 additionalProperties:false 라, 밖에 적으면 설정 검증에서
  # 빌드가 멈춘다. 값을 진짜로 바꾸는 유일한 레버는 package.json 의 `name` 인데,
  # 그건 위 6-8번 줄이 금지한다(Keychain `ticktick Safe Storage` 와 userData 경로가
  # 조용히 따라 옮겨간다).
  # 그래서 업데이터 캐시는 옛 앱과 나눌 수 없고 ~/Library/Caches/ticktick-updater
  # 하나다. 전환 기간의 충돌은 받아들인다(DownloadedUpdateHelper 가 파일 이름 +
  # sha512 로 판정하므로 최악이 재다운로드 한 번이다). **대신 Homebrew cask 의 zap
  # 목록이 그 진짜 경로를 지우게 한다**(.github/workflows/release.yml). 여기 죽은 키를
  # 적어 두면 읽는 사람이 믿고 cask 가 그 거짓말을 따라가 — 실제로 따라갔다:
  # 만들어진 적 없는 ~/Library/Caches/greenday-updater 를 지우고 내려받은 .zip
  # 수백 MB 를 남겼다. 두 자리가 어긋나면 src/shared/updaterCacheDir.test.ts 가 잡는다.
