appId: com.haru.app
productName: haru
directories:
  buildResources: resources
  output: dist
# 허용 목록 방식. 이전에는 제외 패턴만 나열해서, 나중에 생긴 디렉터리는 전부
# 앱 안으로 딸려 들어갔다. 실제로 docs/(설계·배포 문서), .gstack/(QA 리포트 +
# 실제 할 일이 보이는 스크린샷 67장), .superpowers/, CLAUDE.md, TODOS.md가
# 배포본에 포함돼 app.asar이 59.6MB였다.
# 런타임에 필요한 건 out/(main·preload·renderer 번들)과 package.json뿐이고,
# 프로덕션 node_modules는 electron-builder가 알아서 넣는다.
files:
  - out/**/*
  - package.json
mac:
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  category: public.app-category.productivity
  darkModeSupport: true
  # 구글 OAuth 콜백을 받는 커스텀 스킴. 루프백 서버를 열지 않아 MAS 샌드박스에서
  # network.server 권한이 필요 없다.
  protocols:
    - name: haru
      schemes:
        - com.haru.app
mas:
  entitlements: resources/entitlements.mas.plist
  entitlementsInherit: resources/entitlements.mas.inherit.plist
  hardenedRuntime: false
  category: public.app-category.productivity
  # developer.apple.com에서 'Mac App Store' 유형으로 발급받아 이 경로에 둔다.
  # App ID가 com.haru.app 이 아니면 빌드는 되고 업로드에서 거절되므로,
  # scripts/mas-preflight.sh 가 미리 확인한다.
  provisioningProfile: resources/embedded.provisionprofile
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: true
publish:
  provider: github
  owner: supaicy
  repo: haru
