name: Release

on:
  push:
    tags:
      # 새 앱(2.x 이상)만 이 워크플로가 만든다. 브리지 v1.5.0 은 옛 번들 ID 로 로컬에서
      # 빌드해 손으로 올리는 릴리스라(docs/howto-브리지-빌드.md) 여기서 돌면 안 된다 —
      # 돌면 새 앱을 같은 v1.5.0 릴리스에 draft 로 올리고 --latest 로 공개하려 든다.
      # `[]` 범위와 `*` 는 GitHub 필터 문법(workflow-syntax "Filter pattern cheat sheet")이
      # 지원한다. `v1.x` 는 둘째 글자가 1 이고 셋째가 '.' 라 두 패턴 어디에도 걸리지 않는다.
      - 'v[2-9]*'
      - 'v[1-9][0-9]*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # **헬스 스택을 출하 경로에 세운다.** electron-vite 가 쓰는 esbuild 는 타입을
      # 검사하지 않고 지우기만 한다 — `tsc --noEmit` 이 TS2322 로 죽는 파일도 esbuild 는
      # exit 0 으로 번들한다(실측). 그래서 "빌드가 성공했다"는 타입에 대해서도 테스트에
      # 대해서도 아무 말을 하지 않는데, 태그를 밀 때 vitest·tsc·biome 를 한 번이라도
      # 부르는 자리가 이 워크플로에 없었다. 게이트는 "시크릿 7종이 있는가"와
      # "서명·공증됐는가" 둘뿐이라 둘 다 빨간 커밋에는 눈이 없다 — 그대로 공증·스테이플된
      # dmg 가 되고 --latest 로 공개돼 설치된 맥에 자동 업데이트로 내려간다.
      # 가장 아픈 자리는 라이선스다: CLAUDE.md 가 **진짜 경계 검사**로 못 박은
      # ipc-gate.test.ts 의 런타임 대조(목킹된 ipcMain.handle 이 본 채널 집합 ==
      # registeredTiers())가 출하 경로에 안 걸려 있으면, 유료 채널을 free 로 잘못 달거나
      # 게이트 밖에 등록한 빌드가 아무 신호 없이 돈 낸 사람과 안 낸 사람에게 똑같이 나간다.
      #
      # 시크릿 확인보다 **먼저** 돌린다. 1분짜리 검사가 20분짜리 공증 뒤에 오면 실패를
      # 20분 늦게 알게 된다. 정의는 package.json 의 `verify` 한 곳에만 둔다 — 로컬
      # `npm run release`(scripts/release.sh) 도 같은 것을 부른다. 두 경로가 각자 명령을
      # 나열하면 한쪽에만 lint 를 더하는 식으로 갈라지고, 갈라진 쪽이 릴리스 경로면
      # 그 차이는 사용자가 먼저 발견한다.
      - name: Health stack — typecheck · lint · test
        run: npm run verify

      # 서명·공증 시크릿이 하나라도 비어 있으면 여기서 멈춘다.
      # 없으면 electron-builder가 조용히 서명 없이 빌드해서 Gatekeeper에 막히는
      # dmg를 릴리스로 내보내게 된다. 그 실패는 사용자가 먼저 발견한다.
      - name: Preflight — 서명·공증 시크릿 확인
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 없이 나가면 Google 캘린더 연동이 죽은 채 빌드는 성공한다(2026-08 감사 U-1).
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          missing=""
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID GOOGLE_OAUTH_CLIENT_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::필수 시크릿 누락:$missing"
            echo "이대로 진행하면 서명 없는 dmg가 릴리스됩니다. Settings → Secrets에 등록 후 다시 태그하세요."
            exit 1
          fi
          echo "시크릿 7종 확인 완료"

      - name: App Store Connect API 키 파일 생성
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"
          # 형식만 확인(내용은 출력하지 않는다)
          head -1 "$RUNNER_TEMP/private_keys/AuthKey.p8" | grep -q "BEGIN PRIVATE KEY" \
            || { echo "::error::.p8 디코드 실패 — APPLE_API_KEY_B64가 올바른 base64인지 확인하세요"; exit 1; }

      # GOOGLE_OAUTH_CLIENT_ID 는 electron.vite.config.ts 가 __GOOGLE_CLIENT_ID__ 로 박는다.
      # GITHUB_ACTIONS 환경에서는 그 파일이 값이 비면 빌드를 실패시킨다(위 preflight 와 이중).
      - name: Build app
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GREENDAY_RELEASE: '1'
        run: npx electron-vite build

      # 공증은 APPLE_API_KEY / _KEY_ID / _ISSUER 환경변수 존재로 활성화된다
      # (electron-builder 25.x가 보안상 권장하는 방식).
      # 릴리스는 draft로 올라가고, 아래 검증을 통과해야 공개된다.
      - name: Package and publish (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/private_keys/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --arm64 --x64 --publish always

      # 공개 전 마지막 관문. 실패하면 릴리스는 draft로 남아 사용자에게 안 나간다.
      - name: 서명·공증 검증
        run: |
          fail=0
          # **앱 이름을 하드코딩하지 않는다.** productName이 haru → Greenday로
          # 바뀌었을 때 이 목록이 그대로 남아 세 경로 모두 존재하지 않았고,
          # `|| continue` 때문에 루프가 한 번도 돌지 않은 채 fail=0으로 통과했다.
          # 서명·공증이 실패해도 릴리스가 나가는 상태였다 — 그 실패는 사용자가
          # 먼저 발견한다. 이제 glob으로 찾고, 하나도 못 찾으면 그것 자체가 실패다.
          apps=$(ls -d dist/mac*/*.app 2>/dev/null || true)
          if [ -z "$apps" ]; then
            echo "::error::검증할 .app 을 찾지 못했습니다 — dist/mac*/*.app"
            ls -R dist 2>/dev/null | head -40
            exit 1
          fi
          for app in $apps; do
            echo "── $app"
            codesign --verify --deep --strict --verbose=2 "$app" || fail=1
            codesign -dv --verbose=4 "$app" 2>&1 | grep -E "Authority|TeamIdentifier" || true
            # 공증+스테이플이 끝났으면 "source=Notarized Developer ID"가 나온다
            if spctl -a -vvv -t install "$app" 2>&1 | tee /tmp/spctl.txt | grep -q "Notarized Developer ID"; then
              echo "  공증 확인됨"
            else
              echo "::error::$app 이 공증되지 않았습니다"; cat /tmp/spctl.txt; fail=1
            fi
          done
          [ "$fail" = "0" ] || { echo "::error::검증 실패 — 릴리스를 draft로 남깁니다"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false --latest

  bump-cask:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 자산 이름은 electron-builder.yml 의 artifactName(`Greenday-<arch>.dmg`)을 그대로
      # 따른다 — 버전이 안 들어가는 고정 이름이다. 예전에는 `haru-<버전>-<arch>.dmg` 를
      # 받아 SHA를 냈는데, 그 이름은 v1.4.1 이후 존재하지 않아 404 본문의 SHA가 cask에
      # 들어가고 있었다. 이제 받기에 실패하거나 SHA가 비면 여기서 멈춘다.
      - name: Compute SHAs and update tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/supaicy/greenDay/releases/download/${TAG}"

          sha_of() {
            # -f: 404 를 본문이 아니라 실패로. 받은 바이트가 0이면 shasum 이 빈 입력의
            # 해시를 내므로, 파일로 받아 크기까지 본다.
            local url="$1" tmp
            tmp="$(mktemp)"
            curl -fsSL --retry 3 -o "$tmp" "$url" || { echo "::error::내려받기 실패: $url" >&2; exit 1; }
            [ -s "$tmp" ] || { echo "::error::빈 파일: $url" >&2; exit 1; }
            shasum -a 256 "$tmp" | cut -d' ' -f1
            rm -f "$tmp"
          }

          ARM_SHA="$(sha_of "$BASE/Greenday-arm64.dmg")"
          X64_SHA="$(sha_of "$BASE/Greenday-x64.dmg")"
          for pair in "arm64:$ARM_SHA" "x64:$X64_SHA"; do
            if ! [[ "${pair#*:}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::${pair%%:*} SHA가 비었거나 형식이 틀립니다: '${pair#*:}'"
              exit 1
            fi
          done
          echo "arm64 $ARM_SHA"
          echo "x64   $X64_SHA"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/supaicy/homebrew-haru.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p Casks

          # cask 토큰은 소문자 greenday — `brew install --cask supaicy/haru/greenday`.
          # 옛 `Casks/haru.rb`(com.haru.app 시절)는 건드리지 않는다. 브리지 릴리스 결정과
          # 함께 정리한다.
          cat > Casks/greenday.rb <<EOF
          cask "greenday" do
            arch arm: "arm64", intel: "x64"

            version "${VERSION}"
            sha256 arm:   "${ARM_SHA}",
                   intel: "${X64_SHA}"

            url "https://github.com/supaicy/greenDay/releases/download/v#{version}/Greenday-#{arch}.dmg"
            name "Greenday"
            desc "Tasks, calendar, pomodoro and habits for macOS — data stays on your Mac"
            homepage "https://begreen.dev/greenday"

            # Electron 40 의 바닥이자 electron-builder.yml 의 minimumSystemVersion(12.0)
            depends_on macos: ">= :monterey"

            app "Greenday.app"

            # userData 와 캐시는 Electron 내부 앱 이름(ticktick)을 따르고, 나머지는 번들 ID.
            # 업데이터 캐시도 `ticktick-updater` 다 — electron-builder 가 package.json 의
            # `name` 에서 유도하고 electron-builder.yml 이 적은 값은 버린다.
            # `greenday-updater` 라고 적었을 때는 만들어진 적 없는 디렉터리를 지우면서
            # 내려받은 업데이트 .zip(수백 MB)을 사용자 디스크에 그대로 남겼다.
            # src/shared/updaterCacheDir.test.ts 가 이 줄을 package.json 과 묶어 둔다.
            zap trash: [
              "~/Library/Application Support/ticktick",
              "~/Library/Caches/ticktick",
              "~/Library/Caches/ticktick-updater",
              "~/Library/Caches/com.begreen.greenday",
              "~/Library/Caches/com.begreen.greenday.ShipIt",
              "~/Library/Preferences/com.begreen.greenday.plist",
              "~/Library/Saved Application State/com.begreen.greenday.savedState",
              "~/Library/Logs/ticktick",
            ]
          end
          EOF

          git add Casks/greenday.rb
          git commit -m "chore: bump greenday to ${VERSION}"
          git push
